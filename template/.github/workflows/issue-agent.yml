name: Issue Agent

on:
  issues:
    types: [opened]

jobs:
  agent:
    runs-on: ubuntu-latest
    # Only run if the issue author is the allowed user
    if: github.event.issue.user.login == vars.ALLOWED_GITHUB_USER

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Validate issue format
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PYEOF'
          import os, re, sys, uuid

          body = os.environ["ISSUE_BODY"]

          has_type = re.search(r'^##\s+Type\s*\n+\s*(bug|feature)\s*$', body, re.MULTILINE | re.IGNORECASE)
          has_desc = re.search(r'^##\s+Description\s*\n+(.+?)(?=\n##\s|\Z)', body, re.MULTILINE | re.DOTALL)
          has_ac   = re.search(r'^##\s+Acceptance Criteria\s*\n+(?:\s*-\s*\[[ xX]?\]\s*.+\n?)+', body, re.MULTILINE)
          tests_match = re.search(
              r'^##\s+Tests(?:\s*\(optional\))?\s*\n+(.+?)(?=\n##\s|\Z)',
              body, re.MULTILINE | re.IGNORECASE | re.DOTALL,
          )

          def write_output(fh, key, value):
              if "\n" in value:
                  delim = f"GUPPY_{uuid.uuid4().hex}"
                  fh.write(f"{key}<<{delim}\n{value}\n{delim}\n")
              else:
                  fh.write(f"{key}={value}\n")

          github_output = os.environ["GITHUB_OUTPUT"]

          if not (has_type and has_desc and has_ac):
              print("Issue does not match expected format — skipping.")
              with open(github_output, "a") as f:
                  write_output(f, "valid", "false")
              sys.exit(0)

          issue_type = has_type.group(1).lower()
          tests_section = tests_match.group(1).strip() if tests_match else ""

          with open(github_output, "a") as f:
              write_output(f, "valid", "true")
              write_output(f, "issue_type", issue_type)
              write_output(f, "has_tests_section", "true" if tests_section else "false")
              write_output(f, "tests_section", tests_section)
          PYEOF

      - name: Comment and exit if invalid format
        if: steps.validate.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 This issue was not picked up by the agent because it doesn't match the required format. Please use the \"Agent Task\" issue template."
            });

      - name: Checkout repository
        if: steps.validate.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node / Python / etc.
        if: steps.validate.outputs.valid == 'true'
        # Adjust this step for your project's runtime.
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install project dependencies
        if: steps.validate.outputs.valid == 'true'
        run: npm ci   # or: pip install -r requirements.txt, etc.

      - name: Install Claude Code CLI
        if: steps.validate.outputs.valid == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Build agent prompt
        if: steps.validate.outputs.valid == 'true'
        id: prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TYPE: ${{ steps.validate.outputs.issue_type }}
          HAS_TESTS_SECTION: ${{ steps.validate.outputs.has_tests_section }}
          TESTS_SECTION: ${{ steps.validate.outputs.tests_section }}
        run: |
          python3 - <<'PYEOF'
          import os
          import textwrap
          from string import Template

          issue_type = os.environ["ISSUE_TYPE"]
          issue_title = os.environ["ISSUE_TITLE"]
          issue_body = os.environ["ISSUE_BODY"]
          has_tests_section = os.environ["HAS_TESTS_SECTION"] == "true"
          tests_section = os.environ.get("TESTS_SECTION", "")

          if has_tests_section:
              tests_note = (
                  "The reporter listed specific test scenarios in the issue's \"## Tests\" section:\n\n"
                  f"{tests_section}\n\n"
                  "Make sure your tests cover these scenarios, in addition to any other cases you judge necessary."
              )
          else:
              tests_note = (
                  "The issue did not include a \"## Tests\" section. Decide yourself which test "
                  "cases best cover the fix/feature and the acceptance criteria."
              )

          template = Template(textwrap.dedent("""\
              You are an automated software agent working on a GitHub repository.

              A new $issue_type issue has been filed:

              Title: $issue_title

              $issue_body

              Your task:
              1. Read the codebase to understand the relevant code.
              2. Implement the fix or feature described in the issue.
              3. Write automated tests for your change, using the project's existing test framework and conventions. $tests_note
              4. Make sure your changes satisfy the acceptance criteria listed in the issue.
              5. Run the test suite (e.g. npm test) and fix any failures -- including in the tests you just wrote.
              6. Do NOT commit anything -- just make the file changes.

              Important constraints:
              - Only modify files that are necessary to address this issue.
              - Do not add comments explaining what you changed.
              - Do not create migration or changelog files.
              - If the issue is ambiguous or impossible to implement safely, output the single word SKIP and do nothing else.
              """))

          prompt = template.safe_substitute(
              issue_type=issue_type,
              issue_title=issue_title,
              issue_body=issue_body,
              tests_note=tests_note,
          )

          with open("/tmp/agent-prompt.txt", "w") as f:
              f.write(prompt)
          PYEOF

      - name: Run Claude Code agent
        if: steps.validate.outputs.valid == 'true'
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print "$(cat /tmp/agent-prompt.txt)" \
                 --allowedTools "Read,Edit,Write,Bash" \
                 --max-turns 40 \
                 2>&1 | tee /tmp/claude-output.txt

      - name: Upload agent output
        if: steps.validate.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-output-${{ github.event.issue.number }}
          path: /tmp/claude-output.txt
          retention-days: 14

      - name: Check for changes
        if: steps.validate.outputs.valid == 'true'
        id: changes
        run: |
          if grep -q "^SKIP$" /tmp/claude-output.txt; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=agent_skip" >> "$GITHUB_OUTPUT"
          elif git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=no_changes" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment if agent skipped
        if: steps.validate.outputs.valid == 'true' && steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          script: |
            const reason = "${{ steps.changes.outputs.skip_reason }}";
            const msg = reason === "agent_skip"
              ? "🤖 The agent reviewed this issue but determined it could not implement the change safely. Manual intervention is required."
              : "🤖 The agent ran but produced no file changes. Please review the issue description and try again.";
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg
            });

      - name: Create branch, commit, and push
        if: steps.validate.outputs.valid == 'true' && steps.changes.outputs.has_changes == 'true'
        id: push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | cut -c1-40)
          BRANCH="agent/${ISSUE_NUMBER}-${SLUG}"

          git config user.name  "guppy-agent[bot]"
          git config user.email "guppy-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix(#${ISSUE_NUMBER}): ${ISSUE_TITLE}

          Automated fix generated by guppy-agent.
          Closes #${ISSUE_NUMBER}"
          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.validate.outputs.valid == 'true' && steps.changes.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          PR_URL=$(gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "fix(#${ISSUE_NUMBER}): ${ISSUE_TITLE}" \
            --body "## Automated fix for #${ISSUE_NUMBER}

          ${ISSUE_BODY}

          ---
          > Generated by guppy-agent. Please review carefully before merging, including the generated tests.")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on issue with PR link
        if: steps.validate.outputs.valid == 'true' && steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 The agent has created a fix: ${{ steps.pr.outputs.pr_url }}\n\nPlease review the changes (and the generated tests) before merging.`
            });
