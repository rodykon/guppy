[project]
name = "guppy"
version = "0.2.0"
description = "Turns whitelisted GitHub issues into reviewed pull requests via a multi-stage Claude agent pipeline."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "PyGithub>=2.3.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "docker>=7.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
guppy-scheduler = "guppy.scheduler.main:run"
guppy-worker = "guppy.worker.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
